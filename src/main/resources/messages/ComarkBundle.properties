# ---- settings
settings.display.name=Comark
settings.group.files=Comark Files
settings.mode.label=Treat Markdown files as Comark:
settings.mode.auto=In Nuxt Content / Comark projects
settings.mode.auto.comment=.md files in the content directories (<code>content/</code>, collection sources of <code>content.config.ts</code>) of a package whose package.json depends on @nuxt/content, @nuxtjs/mdc, comark or a Comark theme; README.md and other files stay Markdown. .mdc files are always Comark.
settings.content.config=Nuxt Content config:
settings.content.config.comment=Optional: the <code>content.config.ts</code> (or a <code>nuxt.config.ts</code> with Nuxt Content 2 sources) to use instead of the ones found next to package.json files. Absolute, or relative to the project directory. The <code>content/</code> directory next to it and its collection source directories are Comark.
settings.mode.always=All .md files
settings.mode.never=Only .mdc files
settings.excluded.label=Never treat as Comark (glob patterns, one per line):
settings.excluded.comment=Matched against paths relative to the project directory, like .gitignore entries: <code>CHANGELOG.md</code> or <code>legacy</code> match a name at any level, <code>docs/legacy/**</code> or <code>/README.md</code> match from the project directory, and a matching directory excludes everything in it. Lines starting with # are comments. .mdc files are always Comark.
settings.excluded.invalid=Invalid glob pattern: {0}
settings.group.formatting=Formatting
settings.formatter.enabled=Use the Comark formatter for Reformat Code
settings.formatter.enabled.comment=Indents components, slots and YAML props like the VS Code extension. When off, the Markdown formatter is used.
settings.group.components=Components
settings.completion.enabled=Complete component names, props and slots
settings.completion.enabled.comment=Components are discovered from components/ directories, .nuxt/component-meta files and the URL below.
settings.metadata.url=Component metadata URL:
settings.metadata.url.comment=Optional http(s) endpoint returning nuxt-component-meta JSON. Takes precedence over local metadata.
settings.metadata.url.invalid=Enter an http:// or https:// URL
settings.metadata.cache=Cache remote metadata for:
settings.metadata.cache.unit=minutes

